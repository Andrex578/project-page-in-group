<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>

    <header>
        <h1>Logo</h1>
        <nav>
            <a href="#home">Home</a>
            <a href="#Termo e Condições">Termo e Condições</a>
        </nav>
    </header>

    <main id="home">

        <section class="imagem-fundo">
            <h2>Bem-vindo!</h2>
        </section>

        <section class="login">

            <h2>Login</h2>
            <p>Faça o login para usar a plataforma</p>

            <form action="#" method="post">

                <div>
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        required
                    >
                </div>

                <div>
                    <label for="Senha">Senha</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Digite sua senha"
                        required
                    >
                </div>

                <div>


                    <a href="#Esqueceu a senha">Esqueceu a senha?</a>
                </div>

                <button type="submit">Login</button>

                <p>
                    Ainda não tem uma conta?
                    <a href="#register">Registre-se</a>
                </p>

                <button type="button">
                    Login com o Google
                </button>

                <button type="button">
                    Login com o Facebook
                </button>

            </form>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 - Todos os direitos reservados.</p>
    </footer>

</body>
</html>
