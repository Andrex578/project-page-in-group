<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Projeto em Grupo</title>
    <!-- Biblioteca de Ícones do Font Awesome -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <link rel="stylesheet" href="style.css">
    
</head>
<body>

    <!-- Barra de Navegação Superior -->
    <header class="navbar">
        <div class="nav-left-group">
            <div class="logo">Logo</div>
            <nav class="nav-links">
                <a href="index.html">home</a>
                <a href="termos.html">Termos e Condições</a>
            </nav>
        </div>
    </header>

    <!-- Container do Painel de Login -->
    <main class="login-container">
        <button class="close-btn" id="btn-fechar-painel">&times;</button>
        <div class="login-box">
            <h2>Login</h2>
            <p class="subtitle">Please login to use the platform</p>
            
            <form id="form-login">
                <div class="input-group">
                    <label for="email">Email</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" required placeholder="Insira seu e-mail">
                        <i class="fa-regular fa-envelope input-icon"></i>
                    </div>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" required placeholder="Insira sua senha">
                        <i class="fa-solid fa-lock input-icon"></i>
                    </div>
                </div>
                <div class="extra-options">
                    <label class="remember-me">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#" class="forgot-pass" id="link-forgot">Forgot Password?</a>
                </div>
                <button type="submit" class="submit-btn" id="btn-enviar-login">Login</button>
            </form>
            
            <p class="register-text">Don't have an account? <a href="#" id="link-register">Register</a></p>
            
            <div class="social-buttons">
                <button class="social-btn" id="btn-google"><i class="fa-brands fa-google"></i> Login with Google</button>
                <button class="social-btn" id="btn-facebook"><i class="fa-brands fa-facebook-f"></i> Login with Facebook</button>
            </div>
        </div>
    </main>

    <!-- Chamada única do script externo -->
    <script src="pop.js"></script>
</body>
</html>
